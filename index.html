<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft-New — JS Starter</title>
    <style>
      html,body, #app { height: 100%; margin: 0; }
      #block-hint { position: absolute; left: 12px; top: 12px; color: white; font-family: sans-serif; background: rgba(0,0,0,0.4); padding:6px 8px; border-radius:4px }
      #topbar { position: absolute; right: 12px; top: 12px; z-index: 1000; }
      #topbar button { background:#444; color:#fff; border:none; padding:6px 8px; border-radius:6px; cursor:pointer }
      #topbar button:hover { background:#555 }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="topbar">
      <button id="import-world-btn">Import world (.zip/.epk)</button>
    </div>
    <div id="block-hint">Click to lock pointer. Left click = remove; Right click = place</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
